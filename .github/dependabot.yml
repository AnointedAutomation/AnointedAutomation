version: 2
updates:
  # Enable version updates for NuGet
  - package-ecosystem: "nuget"
    directory: "/dotnet"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    target-branch: "develop"
    labels:
      - "dependencies"
      - "automated pr"

  # Enable version updates for GitHub Actions
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    target-branch: "develop"
    labels:
      - "dependencies"
      - "automated pr"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

  # Security audit #240: the other package ecosystems in this repo.
  - package-ecosystem: "npm"
