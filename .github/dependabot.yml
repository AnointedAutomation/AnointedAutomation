  - package-ecosystem: "gradle"
    directory: "/android/AnointedSSO"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"
    # AGP 9 needs Gradle 9.6+ and built-in Kotlin, and com.vanniktech.maven.publish 0.36+ needs AGP 8.13+ and Gradle 9.
    # Do those as one hand-made Gradle/AGP migration, then remove these rules.
    ignore:
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.vanniktech.maven.publish"
        versions: [">=0.36.0"]
    labels:
      - "dependencies"
      - "automated pr"
    groups:
      minor-and-patch:
        patterns:
