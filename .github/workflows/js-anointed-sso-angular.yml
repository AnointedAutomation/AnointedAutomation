name: JS anointed-sso-angular

on:
  push:
    branches: ["master", "develop"]
    paths:
      - "js/anointed-sso-angular/**"
      - "js/anointed-sso/**"
      - ".github/workflows/js-anointed-sso-angular.yml"
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "js/anointed-sso-angular/**"
      - "js/anointed-sso/**"
      - ".github/workflows/js-anointed-sso-angular.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js/anointed-sso-angular
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    # Angular 20 and ng-packagr need Node 20.19 or newer to build; consumers can still run the built package anywhere Angular runs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

