name: Python anointed-sso

on:
  push:
    branches: ["master", "develop"]
    paths:
      - "python/anointed-sso/**"
      - ".github/workflows/python-anointed-sso.yml"
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "python/anointed-sso/**"
      - ".github/workflows/python-anointed-sso.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python/anointed-sso
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest
