name: .NET Test

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push' || github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Logging Tests
        run: dotnet test AnointedAutomation.Logging.Tests/AnointedAutomation.Logging.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Run Memory Tests
        run: dotnet test AnointedAutomation.Memory.Tests/AnointedAutomation.Memory.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Run APIMiddlewares Tests
        run: dotnet test AnointedAutomation.APIMiddlewares.Tests/AnointedAutomation.APIMiddlewares.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Run Repository.Mongo Tests
        run: dotnet test AnointedAutomation.Repository.Mongo.Tests/AnointedAutomation.Repository.Mongo.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Run Repository.MySql Tests
        run: dotnet test AnointedAutomation.Repository.MySql.Tests/AnointedAutomation.Repository.MySql.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Run Algorithms Tests
        run: dotnet test AnointedAutomation.Algorithms.Tests/AnointedAutomation.Algorithms.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Run Imaging Tests
        run: dotnet test AnointedAutomation.Imaging.Tests/AnointedAutomation.Imaging.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Run Concepts Tests
        run: dotnet test AnointedAutomation.Concepts.Tests/AnointedAutomation.Concepts.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Run Mathematics Tests
        run: dotnet test AnointedAutomation.Mathematics.Tests/AnointedAutomation.Mathematics.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*'
