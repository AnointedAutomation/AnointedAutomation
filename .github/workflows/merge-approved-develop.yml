name: Merge approved into develop

# Squash merges an open PR into develop IF AND ONLY IF the cloud Claude reviewer (posting as roku674) approved its
# CURRENT head commit, every check on that commit passed, no review thread is open, it is not a draft, it is
# cleanly mergeable and it is up to date with develop. A Dependabot PR that is behind develop gets one
# "@dependabot rebase" comment per 24 hours instead; the rebase is a new commit that the reviewer re-reviews.
# MERGE_TOKEN (roku674 fine-grained PAT) is required: merges made with GITHUB_TOKEN start no workflows, so the
# develop push CI that release PRs depend on would never run.
on:
  pull_request_review:
    types: [submitted]
  push:
    branches: [develop]
  # Merge as soon as CI finishes on a PR that was approved while its checks were still running
  workflow_run:
    workflows: ['.NET Test', 'CodeQL Analysis']
    types: [completed]
  # Safety sweep for PRs whose last check was an SDK workflow not listed above (was hourly; cut to save Actions minutes)
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-approved-develop
  cancel-in-progress: false

jobs:
  merge:
    # PR CI only really runs for Dependabot (other PRs skip their jobs), so skip the CI-completion sweep otherwise
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
      REPO: ${{ github.repository }}
      REVIEWER: roku674
    steps:
      - name: Merge every approved, green, up-to-date PR into develop
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MERGE_TOKEN secret is not set"
            exit 1
          fi
          owner=${REPO%/*}
          name=${REPO#*/}
          failed=0
          # Run-wide budget for waiting out fresh reviews (job timeout is 10 minutes); past it a fresh verdict is left to the next run
          settle_deadline=$(( $(date +%s) + 420 ))
          # Same-repo PRs only; fork PRs are never auto-merged. Values are assigned before use because set -e does not
          # see a failure inside a for word list or a here-string.
          prs=$(gh pr list -R "$REPO" --base develop --state open --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | .number')
          for pr in $prs; do
            info=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.head.sha) \(.draft) \(.mergeable_state) \(.user.login)"')
            read -r head_sha draft mergeable_state author <<< "$info"
            echo "PR #$pr by $author head $head_sha draft=$draft mergeable_state=$mergeable_state"

            # Only the reviewer account's reviews carrying the marker for the CURRENT head count, and the LATEST of them by
            # submitted_at is the verdict. Every state but DISMISSED counts, so a newer CHANGES_REQUESTED outranks an older
            # approval (on its own PRs the reviewer posts COMMENTED, because GitHub forbids self-approval).
            # The verdict must also be at least 5 minutes old: parallel reviewer runs on the same head can post a superseding
            # "changes requested" seconds after an approval (AnointedAutomation#417). Same rule as refire-unreviewed-prs.sh.
            # --slurp joins every page. Prints "<age in seconds> <first line of the latest marker review>" or "none".
            latest_review() {
              gh api "repos/$REPO/pulls/$pr/reviews?per_page=100" --paginate --slurp \
                | jq -r --arg reviewer "$REVIEWER" --arg marker "<!-- claude-review sha=$head_sha -->" \
                  '[add[] | select(.user.login == $reviewer and .state != "DISMISSED" and .submitted_at != null and (.body | contains($marker)))] | sort_by(.submitted_at) | last | if . == null then "none" else "\(now - (.submitted_at | fromdateiso8601) | floor) \(.body | split("\n")[0])" end'
            }
            min_age=300
            result=$(latest_review)
            if [ "$result" != "none" ]; then
              age=${result%% *}
              wait_s=$((min_age - age + 5))
              if [ "$age" -lt "$min_age" ] && [ $(( $(date +%s) + wait_s )) -le "$settle_deadline" ]; then
                # A fresh verdict is waited out inside this run (this run was triggered by that very review, and a superseding
                # review triggers its own run), so the PR is not left for the 6-hourly schedule. Bounded by the run-wide settle_deadline.
                echo "  latest Claude review is ${age}s old; waiting ${wait_s}s for a superseding verdict"
                sleep "$wait_s"
                result=$(latest_review)
              fi
            fi
            if [ "$result" = "none" ]; then
              verdict="none"
            else
              age=${result%% *}
              verdict=${result#* }
              if [ "$age" -lt "$min_age" ]; then
                echo "  skip: latest Claude review for $head_sha is only ${age}s old; the next run picks it up"
                continue
              fi
            fi
            case "$verdict" in
              "✅ Claude review: approved"*) ;;
              *) echo "  skip: no approving Claude review for $head_sha (got: ${verdict:-none})"; continue ;;
            esac
            if [ "$draft" != "false" ]; then
              echo "  skip: draft"
              continue
            fi

            behind=$(gh api "repos/$REPO/compare/develop...$head_sha" --jq .behind_by)
            if [ "$behind" -ne 0 ]; then
              if [ "$author" = "dependabot[bot]" ]; then
                since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
                asked=$(gh api "repos/$REPO/issues/$pr/comments?per_page=100&since=$since" --jq '[.[] | select(.body | startswith("@dependabot rebase"))] | length')
                if [ "$asked" -eq 0 ]; then
                  gh pr comment "$pr" -R "$REPO" --body "@dependabot rebase"
                  echo "  $behind commits behind develop: asked Dependabot to rebase"
                else
                  echo "  $behind commits behind develop: rebase already requested in the last 24 hours"
                fi
              else
                echo "  skip: $behind commits behind develop; the author must update the branch"
              fi
              continue
            fi

            # Every check on the head commit except the housekeeping runs (merge, promote, weekly release PR) must have passed or been skipped. No
            # build is required here: in most of these repos CI skips human PRs by design (it runs on the develop push),
            # the Claude review runs the relevant tests itself, and the release PR gate requires the real CI to pass.
            if ! checks=$(gh pr checks "$pr" -R "$REPO" --json name,bucket,workflow 2>&1); then
              if ! grep -q '^\[' <<< "$checks"; then
                echo "::error::Could not read checks for PR #$pr: $checks"
                failed=1
                continue
              fi
            fi
            others=$(jq -c '[.[] | select(.workflow != "Merge approved into develop" and .workflow != "Promote release" and .workflow != "Weekly release PR")]' <<< "$checks")
            not_green=$(jq -r '[.[] | select(.bucket != "pass" and .bucket != "skipping") | "\(.name)=\(.bucket)"] | join(", ")' <<< "$others")
            if [ -n "$not_green" ]; then
              echo "  skip: checks not green ($not_green)"
              continue
            fi

            open_threads=$(gh api graphql -f owner="$owner" -f name="$name" -F pr="$pr" -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) { reviewThreads(first: 100) { nodes { isResolved } } }
                }
              }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
            if [ "$open_threads" -ne 0 ]; then
              echo "  skip: $open_threads unresolved review threads"
              continue
            fi

            # GitHub computes mergeability lazily; read once more if it was not ready
            if [ "$mergeable_state" = "unknown" ]; then
              sleep 5
              mergeable_state=$(gh api "repos/$REPO/pulls/$pr" --jq .mergeable_state)
            fi
            # unstable only means some check is not green, and the gate above proved those are only the housekeeping runs
            if [ "$mergeable_state" != "clean" ] && [ "$mergeable_state" != "unstable" ]; then
              echo "  skip: mergeable_state is $mergeable_state"
              continue
            fi

            if gh pr merge "$pr" -R "$REPO" --squash --match-head-commit "$head_sha"; then
              echo "  merged into develop"
            else
              echo "::error::Merge of PR #$pr into develop failed"
              failed=1
            fi
          done
          exit "$failed"
