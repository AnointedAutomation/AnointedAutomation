# Publishes php/anointed-sso as the ROOT of a read-only mirror repo, because Packagist reads composer.json only
# at a repository root. Manual only. Needs a secret PHP_SPLIT_TOKEN (a fine-grained token with Contents:
# read and write on the target repo). The target repo must already exist; this workflow never creates one.
name: PHP split

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Mirror repo as owner/name"
        required: true
        type: string
      branch:
        description: "Branch to update in the mirror"
        required: true
        type: string
      tag:
        description: "Optional release tag to create in the mirror (for example v1.0.0)"
        required: false
        type: string

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Split php/anointed-sso into its own history
        run: git subtree split --prefix=php/anointed-sso --branch php-split

      - name: Push to the mirror
        env:
          PHP_SPLIT_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ inputs.branch }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          test -n "$PHP_SPLIT_TOKEN"
          git remote add mirror "https://x-access-token:${PHP_SPLIT_TOKEN}@github.com/${TARGET_REPO}.git"
          git push mirror "php-split:refs/heads/${TARGET_BRANCH}" --force
          if [ -n "$TARGET_TAG" ]; then
            git push mirror "php-split:refs/tags/${TARGET_TAG}"
          fi
