name: JS anointed-sso-nuxt

on:
  push:
    branches: ["master", "develop"]
    paths:
      - "js/anointed-sso-nuxt/**"
      - "js/anointed-sso/**"
      - ".github/workflows/js-anointed-sso-nuxt.yml"
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "js/anointed-sso-nuxt/**"
      - "js/anointed-sso/**"
      - ".github/workflows/js-anointed-sso-nuxt.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js/anointed-sso-nuxt
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22", "24"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js/anointed-sso-nuxt
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Prepare dependencies
        run: npm test

      - name: Type-check index.d.ts
        run: npx -y -p typescript@5 tsc --noEmit --strict --lib es2022,dom --skipLibCheck index.d.ts
