name: PHP anointed-sso

on:
  push:
    branches: ["master", "develop"]
    paths:
      - "php/**"
      - ".github/workflows/php-anointed-sso.yml"
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "php/**"
      - ".github/workflows/php-anointed-sso.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: php/anointed-sso
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, openssl, mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit (core)
        run: vendor/bin/phpunit --testsuite core

  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: php/anointed-sso
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, openssl, mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies with Laravel test harness
        run: |
          composer install --no-interaction --prefer-dist
          composer require --dev orchestra/testbench:^10.0 --no-interaction --with-all-dependencies

      - name: Run PHPUnit (Laravel integration)
        run: vendor/bin/phpunit --testsuite laravel
