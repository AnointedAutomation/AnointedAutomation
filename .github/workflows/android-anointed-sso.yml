name: Android AnointedSSO

on:
  push:
    branches: ["master", "develop"]
    paths:
      - "android/AnointedSSO/**"
      - ".github/workflows/android-anointed-sso.yml"
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "android/AnointedSSO/**"
      - ".github/workflows/android-anointed-sso.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/AnointedSSO
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle :anointedsso:testDebugUnitTest --no-daemon

      - name: Build release
        run: gradle :anointedsso:assembleRelease --no-daemon
