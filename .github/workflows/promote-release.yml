name: Promote release

# Merges the open develop -> default branch release PR IF AND ONLY IF the cloud Claude reviewer (posting as
# roku674) approved its CURRENT head commit, every check on that commit passed, no review thread is open and
# the PR is cleanly mergeable. Anything else leaves the PR alone. Squash when the PR has more than one commit,
# merge commit when it has exactly one.
# Deploys land at 8 AM America/New_York year-round: cron fires at 12:00 and 13:00 UTC and the run only acts when the
# New York hour is 8, which covers DST. workflow_dispatch skips the time check (still requires the approval). Scheduled
# runs only read this file from the default branch, so the first promotion per repo is manual. MERGE_TOKEN (roku674
# fine-grained PAT) is required: a GITHUB_TOKEN merge starts no workflows, so master push workflows would not run.
on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
      REPO: ${{ github.repository }}
      REVIEWER: roku674
      EVENT: ${{ github.event_name }}
    steps:
      - name: Merge the release PR only if approved
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MERGE_TOKEN secret is not set"
            exit 1
          fi
          if [ "$EVENT" = "schedule" ]; then
            ny_hour=$(TZ=America/New_York date +%H)
            if [ "$ny_hour" != "08" ]; then
              echo "New York hour is $ny_hour, not 08; the other cron covers 8 AM."
              exit 0
            fi
          fi
          default_branch=$(gh api "repos/$REPO" --jq .default_branch)
          pr=$(gh pr list -R "$REPO" --base "$default_branch" --head develop --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open develop -> $default_branch PR."
            exit 0
          fi

          read -r head_sha draft commits mergeable_state <<< "$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.head.sha) \(.draft) \(.commits) \(.mergeable_state)"')"
          echo "PR #$pr head $head_sha draft=$draft commits=$commits mergeable_state=$mergeable_state"

          # Only the reviewer account's LAST review carrying the marker for the CURRENT head counts
          verdict=$(gh api "repos/$REPO/pulls/$pr/reviews?per_page=100" --paginate \
            --jq "[.[] | select(.user.login == \"$REVIEWER\" and (.body | contains(\"<!-- claude-review sha=$head_sha -->\")))] | last | .body" \
            | head -n 1)
          case "$verdict" in
            "✅ Claude review: approved"*) echo "Claude review approved $head_sha." ;;
            *) echo "Not promoting: no approving Claude review for $head_sha (got: ${verdict:-none})."; exit 0 ;;
          esac

          if [ "$draft" != "false" ]; then
            echo "Not promoting: PR is a draft."
            exit 0
          fi

          # Every check on the head commit (except this workflow's own run) must have passed or been skipped
          if ! checks=$(gh pr checks "$pr" -R "$REPO" --json name,bucket,workflow 2>&1); then
            if ! grep -q '^\[' <<< "$checks"; then
              echo "Not promoting: could not read checks: $checks"
              exit 0
            fi
          fi
          others=$(jq -c '[.[] | select(.workflow != "Promote release")]' <<< "$checks")
          total=$(jq 'length' <<< "$others")
          not_green=$(jq -r '[.[] | select(.bucket != "pass" and .bucket != "skipping") | "\(.name)=\(.bucket)"] | join(", ")' <<< "$others")
          if [ "$total" -eq 0 ] || [ -n "$not_green" ]; then
            echo "Not promoting: checks not green (total $total; ${not_green:-none listed})."
            exit 0
          fi

          owner=${REPO%/*}
          name=${REPO#*/}
          open_threads=$(gh api graphql -f owner="$owner" -f name="$name" -F pr="$pr" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) { reviewThreads(first: 100) { nodes { isResolved } } }
              }
            }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          if [ "$open_threads" -ne 0 ]; then
            echo "Not promoting: $open_threads unresolved review threads."
            exit 0
          fi

          if [ "$mergeable_state" != "clean" ]; then
            echo "Not promoting: mergeable_state is $mergeable_state (develop may need a rebase onto $default_branch)."
            exit 0
          fi

          if [ "$commits" -gt 1 ]; then method="--squash"; else method="--merge"; fi
          gh pr merge "$pr" -R "$REPO" "$method" --match-head-commit "$head_sha"
          echo "Promoted PR #$pr to $default_branch with $method."
