name: Promote release

# Merges the open develop -> default branch release PR IF AND ONLY IF the cloud Claude reviewer (posting as
# roku674) approved its CURRENT head commit, every check on that commit passed, no review thread is open and
# the PR is cleanly mergeable. Anything else leaves the PR alone. Squash when the PR has more than one commit,
# merge commit when it has exactly one.
# Deploys land at 8 AM America/New_York year-round: crons fire at 12:07 and 13:07 UTC (off the busy top of the hour)
# and the run acts only on the cron that is 8 AM in New York at today's UTC offset, which covers DST.
# workflow_dispatch skips the time check (still requires the approval). Scheduled
# runs only read this file from the default branch, so the first promotion per repo is manual. MERGE_TOKEN (roku674
# fine-grained PAT) is required: a GITHUB_TOKEN merge starts no workflows, so master push workflows would not run.
on:
  schedule:
    - cron: '7 12 * * *'
    - cron: '7 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
      REPO: ${{ github.repository }}
      REVIEWER: roku674
      EVENT: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Merge the release PR only if approved
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MERGE_TOKEN secret is not set"
            exit 1
          fi
          # Act on WHICH cron fired, not the wall clock, so a delayed run still promotes: 12 UTC is 8 AM New York in
          # summer (EDT, -0400), 13 UTC in winter (EST, -0500)
          if [ "$EVENT" = "schedule" ]; then
            ny_offset=$(TZ=America/New_York date +%z)
            cron_hour=$(awk '{print $2}' <<< "$SCHEDULE")
            case "$ny_offset:$cron_hour" in
              -0400:12|-0500:13) echo "Cron '$SCHEDULE' is the 8 AM New York slot." ;;
              -0400:13|-0500:12) echo "Cron '$SCHEDULE' is not the 8 AM New York slot today; the other cron covers it."; exit 0 ;;
              *) echo "::error::Unexpected cron '$SCHEDULE' or New York offset $ny_offset"; exit 1 ;;
            esac
          fi
          default_branch=$(gh api "repos/$REPO" --jq .default_branch)
          # Same-repo develop only: a fork's branch named develop must never be promoted
          pr=$(gh pr list -R "$REPO" --base "$default_branch" --head develop --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false) | .number] | first')
          # gh --jq prints nothing for a null result
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open develop -> $default_branch PR."
            exit 0
          fi

          # Assigned first: set -e does not see a failure inside a here-string
          info=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.head.sha) \(.draft) \(.commits) \(.mergeable_state)"')
          read -r head_sha draft commits mergeable_state <<< "$info"
          echo "PR #$pr head $head_sha draft=$draft commits=$commits mergeable_state=$mergeable_state"

          # Only the reviewer account's LAST review carrying the marker for the CURRENT head counts
          # Every state but DISMISSED counts, so a newer CHANGES_REQUESTED outranks an older approval (on its own PRs the
          # reviewer posts COMMENTED, because GitHub forbids self-approval).
          # --slurp joins every page so `last` really is the newest matching review.
          verdict=$(gh api "repos/$REPO/pulls/$pr/reviews?per_page=100" --paginate --slurp \
            | jq -r --arg reviewer "$REVIEWER" --arg marker "<!-- claude-review sha=$head_sha -->" \
              '[add[] | select(.user.login == $reviewer and .state != "DISMISSED" and (.body | contains($marker)))] | last | if . == null then "none" else (.body | split("\n")[0]) end')
          case "$verdict" in
            "✅ Claude review: approved"*) echo "Claude review approved $head_sha." ;;
            *) echo "Not promoting: no approving Claude review for $head_sha (got: ${verdict:-none})."; exit 0 ;;
          esac

          if [ "$draft" != "false" ]; then
            echo "Not promoting: PR is a draft."
            exit 0
          fi

          # Every check on the head commit except the merge housekeeping runs must have passed or been skipped, and at
          # least one must have passed (an all-skipped set means nothing was built or tested)
          if ! checks=$(gh pr checks "$pr" -R "$REPO" --json name,bucket,workflow 2>&1); then
            if ! grep -q '^\[' <<< "$checks"; then
              echo "::error::Could not read checks: $checks"
              exit 1
            fi
          fi
          others=$(jq -c '[.[] | select(.workflow != "Promote release" and .workflow != "Merge approved into develop")]' <<< "$checks")
          passed=$(jq '[.[] | select(.bucket == "pass")] | length' <<< "$others")
          not_green=$(jq -r '[.[] | select(.bucket != "pass" and .bucket != "skipping") | "\(.name)=\(.bucket)"] | join(", ")' <<< "$others")
          if [ "$passed" -eq 0 ] || [ -n "$not_green" ]; then
            echo "Not promoting: checks not green (passed $passed; ${not_green:-none failing})."
            exit 0
          fi

          owner=${REPO%/*}
          name=${REPO#*/}
          open_threads=$(gh api graphql -f owner="$owner" -f name="$name" -F pr="$pr" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) { reviewThreads(first: 100) { nodes { isResolved } } }
              }
            }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          if [ "$open_threads" -ne 0 ]; then
            echo "Not promoting: $open_threads unresolved review threads."
            exit 0
          fi

          # GitHub computes mergeability lazily; read once more if it was not ready
          if [ "$mergeable_state" = "unknown" ]; then
            sleep 5
            mergeable_state=$(gh api "repos/$REPO/pulls/$pr" --jq .mergeable_state)
          fi
          # unstable only means some check is not green, and the gate above proved those are only the housekeeping runs
          if [ "$mergeable_state" != "clean" ] && [ "$mergeable_state" != "unstable" ]; then
            echo "Not promoting: mergeable_state is $mergeable_state (develop may need a rebase onto $default_branch)."
            exit 0
          fi

          if [ "$commits" -gt 1 ]; then method="--squash"; else method="--merge"; fi
          gh pr merge "$pr" -R "$REPO" "$method" --match-head-commit "$head_sha"
          echo "Promoted PR #$pr to $default_branch with $method."
