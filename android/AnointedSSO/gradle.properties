org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.13 otherwise pins each compile classpath to its runtime classpath, which lacks the compileOnly Compose libraries
# and made compileKotlin fail on older androidx.annotation/coroutines. Library publishing is unaffected.
android.dependency.useConstraints=false
