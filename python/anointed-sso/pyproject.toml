[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anointedautomation-sso"
version = "0.1.1"
description = "Sign in with Anointed Automation: a server-side OpenID Connect kit (auth code + PKCE) for Python, with Django, FastAPI/Starlette and Flask adapters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anointed Automation Corporation." }]
keywords = ["anointed-automation", "oidc", "openid-connect", "oauth2", "sso", "pkce", "django", "fastapi", "flask"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["PyJWT[crypto]>=2.8"]

[project.optional-dependencies]
django = ["Django>=4.2"]
fastapi = ["fastapi>=0.110", "starlette>=0.37"]
flask = ["Flask>=3.0"]
test = ["pytest>=8", "Django>=4.2", "fastapi>=0.110", "starlette>=0.37", "httpx>=0.27", "Flask>=3.0"]

[project.urls]
Homepage = "https://anointed.company"
Repository = "https://github.com/AnointedAutomation/AnointedAutomation"
Documentation = "https://github.com/AnointedAutomation/AnointedAutomation/blob/master/docs/SIGN_IN_WITH_ANOINTED_AUTOMATION.md"

[tool.setuptools.packages.find]
include = ["anointedautomation_sso*"]

[tool.setuptools.package-data]
anointedautomation_sso = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
